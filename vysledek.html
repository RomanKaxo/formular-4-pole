<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Výsledek formuláře</title>
</head>
<body>
<h1>Přijaté údaje přes GET</h1>
<dl>
<dt>Jméno</dt><dd id="jmeno"></dd>
<dt>E-mail</dt><dd id="email"></dd>
<dt>Telefon</dt><dd id="telefon"></dd>
<dt>Zpráva</dt><dd id="zprava"></dd>
</dl>
<noscript>Pro vypsání parametrů z adresy povol JavaScript.</noscript>
<p><a href="index.html">Zpět na formulář</a></p>
<script>
const params = new URLSearchParams(window.location.search);
for (const name of ['jmeno', 'email', 'telefon', 'zprava']) {
  document.getElementById(name).textContent = params.get(name) ?? '';
}
</script>
</body>
</html>
